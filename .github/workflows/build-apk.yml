name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify project structure
        run: |
          if [ ! -f "build.gradle.kts" ] && [ ! -f "build.gradle" ]; then
            echo "Error: Android project root not found."
            exit 1
          fi
          if [ ! -d "app" ]; then
            echo "Error: Application module 'app' not found."
            exit 1
          fi
          if [ ! -f "gradlew" ]; then
            echo "Error: Gradle wrapper 'gradlew' not found."
            exit 1
          fi

      - name: Generate debug keystore
        run: |
          # app/build.gradle.kts requires debug.keystore at rootDir
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Clear caches
        run: |
          rm -rf .gradle
          rm -rf app/build

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-app-debug-apk
          path: app/build/outputs/apk/debug/**/*.apk
          if-no-files-found: error
